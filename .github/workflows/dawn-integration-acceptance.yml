name: DAWN integration acceptance

on:
  pull_request:
    paths:
      - 'dawn-integration/**'
      - '.github/workflows/dawn-integration-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run secret-free acceptance
        run: python dawn-integration/acceptance.py
